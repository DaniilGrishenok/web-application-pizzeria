
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Оплата</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
             margin: 0;
             padding: 0;
             font-family: Arial, sans-serif;
        }

        #loader-wrapper {
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .text-end {
            display: none;
        }

        #loader-wrapper.loaded .text-end {
            display: block;
        }
    </style>
</head>
<body>
<div id="loader-wrapper">
    <div id="loader"></div>
    <div class="text-end">
        <!-- Используйте span для отображения сообщения о статусе оплаты -->
        <p><strong><span id="payment-message">Заказ успешно создан</span></strong></p>
        <!-- Добавьте кнопку для возврата на главную страницу -->
        <button id="return-home-btn" class="btn btn-primary" style="display: none;">Вернуться на главную</button>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
    $(document).ready(function() {

        setTimeout(function(){
            $("#loader-wrapper").addClass("loaded");
            $("#payment-message").text("Заказ успешно оплачен");
            $("#return-home-btn").show();
        }, 2000);

        $("#return-home-btn").click(function() {
            // При нажатии кнопки отправить запрос на изменение статуса заказа на "оплачен"
            $.ajax({
                url: '/order/payment/' + orderId,
                type: 'GET',
                success: function(response) {
                    console.log("Статус заказа изменен на оплачен");
                    // Перенаправить пользователя на главную страницу
                    window.location.href = "/";
                },
                error: function(xhr, status, error) {
                    console.error("Ошибка при изменении статуса заказа: " + error);
                }
            });
        });
    });
</script>
</body>
</html>
